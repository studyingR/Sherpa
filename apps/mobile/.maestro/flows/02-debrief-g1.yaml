appId: host.exp.Exponent
name: "02 Debrief (chat) G1 → review → approve → confirm → saved"
---
- runFlow: ../subflows/sign-in-maya.yaml
- tapOn: "Type instead"
- extendedWaitUntil: { visible: "Is that the one?", timeout: 15000 }
- tapOn: "Send: Yes, that's the one."
- tapOn: "Send: Good meeting.*"
- extendedWaitUntil: { visible: "I'm logging that as a complaint, per policy.", timeout: 15000 }
- tapOn: "Send: Treasury services should call Jane by Wednesday."
- extendedWaitUntil: { visible: "Review on screen", timeout: 15000 }
- tapOn: "Review on screen"
- assertVisible: "Logged as a complaint, per policy"
- scrollUntilVisible: { element: "Approve creating this opportunity" }
- tapOn: "Approve creating this opportunity"
- tapOn: "Confirm & save to Salesforce"
- extendedWaitUntil: { visible: "Saved to Salesforce", timeout: 15000 }
- assertVisible: "Task: Send equipment financing term sheet.*"
- assertVisible: "Task: Call Jane about wire delays.*"
- assertVisible: "Task: Introduce FX specialist"
- assertVisible: "Opportunity: Equipment financing.*"
- assertVisible: "Complaint case routed to .*"
